name: Coletar preços

on:
  schedule:
    - cron: "17 */6 * * *"   # a cada 6 horas (27/11: menos builds do Cloudflare enquanto o site é estruturado; voltar a */3 depois)
    - cron: "47 12 * * 0"    # domingo 09h: também busca histórico novo na Wayback
  workflow_dispatch:
    inputs:
      historico:
        description: "Buscar histórico na Wayback Machine? (sim/nao)"
        default: "nao"
      meses:
        description: "Histórico de quantos meses para trás? (máx. 12)"
        default: "12"

concurrency: coleta  # nunca duas coletas ao mesmo tempo

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r collector/requirements.txt

      # coleta numa cópia do banco e só no fim mescla no banco real (o PC do dono coleta a Amazon ao mesmo tempo)
      - name: Preço de hoje (KaBuM!, Steam e Mercado Livre)
        env:  # sem os secrets, o coletor pula o Mercado Livre e segue
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: |
          cp data/muquirana.db "$RUNNER_TEMP/coleta.db"
          MUQ_DB="$RUNNER_TEMP/coleta.db" python collector/muq.py coletar --lojas "$(python collector/muq.py lojas github)"

      - name: Histórico (Wayback Machine)
        if: github.event.schedule == '47 12 * * 0' || inputs.historico == 'sim'
        # para antes do limite do job (340 min) para sempre dar tempo de salvar; o resto continua na próxima
        run: MUQ_DB="$RUNNER_TEMP/coleta.db" python collector/muq.py historico --pausa 3 --max-minutos 270 --meses ${{ inputs.meses || 12 }}

      - name: Entregar a coleta para o job "salvar"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coleta-github
          path: ${{ runner.temp }}/coleta.db
          retention-days: 1

  # lojas que só mostram o preço com navegador de verdade (PlayStation Store): job separado, é mais lento
  coletar-navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r collector/requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Preço de hoje (lojas com navegador)
        run: |
          cp data/muquirana.db "$RUNNER_TEMP/coleta.db"
          MUQ_DB="$RUNNER_TEMP/coleta.db" python collector/muq.py coletar --lojas "$(python collector/muq.py lojas github-nav)"
      - name: Entregar a coleta para o job "salvar"
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coleta-navegador
          path: ${{ runner.temp }}/coleta.db
          retention-days: 1

  # junta as duas coletas num commit só: 1 push = 1 build do Cloudflare (limite grátis de 500 por mês)
  salvar:
    needs: [coletar, coletar-navegador]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r collector/requirements.txt
      - uses: actions/download-artifact@v4
        continue-on-error: true  # se uma das coletas falhou, salva a outra
        with:
          name: coleta-github
          path: ${{ runner.temp }}/github
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coleta-navegador
          path: ${{ runner.temp }}/nav
      - name: Salvar no repositório
        env:  # cupons automáticos da Lomadee (sem a chave, ficam os de antes)
          LOMADEE_API_KEY: ${{ secrets.LOMADEE_API_KEY }}
        run: |
          git config user.name "muquirana-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          G="$RUNNER_TEMP/github/coleta.db"; N="$RUNNER_TEMP/nav/coleta.db"
          [ -f "$G" ] || [ -f "$N" ] || { echo "nenhuma coleta para salvar"; exit 1; }
          for i in 1 2 3 4 5; do
            # sempre parte da versão mais nova do repositório e mescla só o que estas coletas trouxeram
            git fetch -q origin main && git reset -q --hard origin/main
            [ -f "$G" ] && python collector/muq.py mesclar "$G" --lojas "$(python collector/muq.py lojas github)" --wayback
            [ -f "$N" ] && python collector/muq.py mesclar "$N" --lojas "$(python collector/muq.py lojas github-nav)"
            python collector/muq.py cupons
            python collector/muq.py exportar
            git add data/muquirana.db data.js data/cupons-auto.json
            git diff --cached --quiet && exit 0
            git commit -q -m "Preços de $(TZ=America/Sao_Paulo date '+%F %Hh%M')"
            git push -q && exit 0
            sleep 15
          done
          exit 1
