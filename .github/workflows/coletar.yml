name: Coletar preços

on:
  schedule:
    - cron: "0 */3 * * *"    # a cada 3 horas: preços mudam várias vezes por dia em promoções
    - cron: "0 12 * * 0"     # domingo 09h: também busca histórico novo na Wayback
  workflow_dispatch:
    inputs:
      historico:
        description: "Buscar histórico na Wayback Machine? (sim/nao)"
        default: "nao"
      meses:
        description: "Histórico de quantos meses para trás? (máx. 12)"
        default: "12"

concurrency: coleta  # nunca duas coletas ao mesmo tempo

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r collector/requirements.txt

      # coleta numa cópia do banco e só no fim mescla no banco real (o PC do dono coleta a Amazon ao mesmo tempo)
      - name: Preço de hoje (KaBuM! e Steam)
        run: |
          cp data/muquirana.db "$RUNNER_TEMP/coleta.db"
          MUQ_DB="$RUNNER_TEMP/coleta.db" python collector/muq.py coletar --lojas kabum,steam

      - name: Histórico (Wayback Machine)
        if: github.event.schedule == '0 12 * * 0' || inputs.historico == 'sim'
        # para antes do limite do job (340 min) para sempre dar tempo de salvar; o resto continua na próxima
        run: MUQ_DB="$RUNNER_TEMP/coleta.db" python collector/muq.py historico --pausa 3 --max-minutos 270 --meses ${{ inputs.meses || 12 }}

      - name: Salvar no repositório
        if: ${{ !cancelled() }}
        run: |
          git config user.name "muquirana-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            # sempre parte da versão mais nova do repositório e mescla só o que esta coleta trouxe
            git fetch -q origin main && git reset -q --hard origin/main
            python collector/muq.py mesclar "$RUNNER_TEMP/coleta.db" --lojas kabum,steam --wayback
            python collector/muq.py exportar
            git add data/muquirana.db data.js
            git diff --cached --quiet && exit 0
            git commit -q -m "Preços de $(TZ=America/Sao_Paulo date '+%F %Hh%M') · KaBuM! e Steam"
            git push -q && exit 0
            sleep 15
          done
          exit 1
