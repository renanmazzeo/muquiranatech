name: Testar Lenovo

# Roda quando o coletor da Lenovo muda (ou na mão). Não salva nada: coleta numa cópia do banco e confere se a
# loja responde ao robô do GitHub e se vieram produtos suficientes. (Os preços foram conferidos contra a ficha,
# "À vista no PIX", no navegador em 26/11/2026: 10 de 10 iguais.)
on:
  push:
    branches: [main]
    paths: ["collector/lenovo.py", ".github/workflows/testar-lenovo.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lenovo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r collector/requirements.txt
      - name: Coletar numa cópia
        run: |
          MUQ_DB="$RUNNER_TEMP/le.db" python collector/muq.py coletar --lojas lenovo
          python - <<'PY'
          import os, sqlite3, sys
          c = sqlite3.connect(os.environ["RUNNER_TEMP"] + "/le.db")
          n = c.execute("select count(*) from products where store='lenovo'").fetchone()[0]
          print(f"::notice::lenovo {n} produtos coletados no GitHub")
          for name, price in c.execute("select p.name, x.price from products p join prices x on x.product_id=p.id "
                                       "where p.store='lenovo' order by x.price limit 5"):
              print(f"::notice::{name[:60]}: R$ {price}")
          if n < 100:
              sys.exit(1)
          PY
