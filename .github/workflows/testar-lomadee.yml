# Teste da API de afiliado da Lomadee com a chave do secret LOMADEE_API_KEY (só leitura).
# Mostra quais lojas de tecnologia existem, se o canal está ativo, exemplos de produtos com preço e cupons.
# Nunca imprime a chave.
name: Testar Lomadee
on: workflow_dispatch
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testar a API
        env:
          LOMADEE_API_KEY: ${{ secrets.LOMADEE_API_KEY }}
        run: |
          pip install -q requests
          python - <<'EOF'
          import os, time, requests
          K = os.environ.get("LOMADEE_API_KEY")
          if not K:
              raise SystemExit("Falta o secret LOMADEE_API_KEY")
          API = "https://api.lomadee.com.br"
          H = {"x-api-key": K, "Accept": "application/json", "User-Agent": "MuquiranaTech/1.0"}

          def get(path, **params):
              time.sleep(1.2)  # limite: 60 por minuto
              r = requests.get(API + path, headers=H, params=params, timeout=30)
              try:
                  j = r.json()
              except ValueError:
                  j = {}
              if r.status_code != 200:
                  print(f"  {path} -> {r.status_code} {j.get('code') or ''} {j.get('message') or ''}")
                  return None
              return j

          print("== CANAIS")
          c = get("/affiliate/channels")
          for ch in (c or {}).get("data", []):
              print(" ", ch.get("name"), "|", ch.get("slug") or ch.get("address"), "|", ch.get("status"))

          print("== LOJAS (marcas)")
          lojas = {}
          for q in ["terabyte", "pichau", "magalu", "magazine", "casas bahia", "americanas", "kabum", "samsung",
                    "motorola", "dell", "lenovo", "fast shop", "kalunga", "amazon", "acer", "asus", "positivo",
                    "lg", "philips", "multilaser", "girafa", "carrefour", "ponto", "extra", "submarino", "shoptime"]:
              j = get("/affiliate/brands", search=q, limit=20)
              for b in (j or {}).get("data", []):
                  if b["id"] in lojas:
                      continue
                  lojas[b["id"]] = b
                  com = (b.get("commission") or {}).get("value")
                  canais = [x.get("message") or "ok" for x in b.get("channels") or []]
                  print(f"  {b.get('name')[:30]:30} {b.get('site') or '':40} comissão={com}%  segmento={b.get('segment')}  canal={canais}")

          print("== PRODUTOS (exemplos por loja)")
          for bid, b in lojas.items():
              j = get("/affiliate/products", organizationIds=bid, limit=3, isAvailable="true")
              if not j:
                  continue
              print(f"  {b.get('name')}: {j.get('count')} produtos")
              for p in j.get("data", [])[:3]:
                  o = (p.get("options") or [{}])[0]
                  pr = (o.get("pricing") or [{}])[0]
                  print(f"     R$ {(pr.get('price') or 0)/100:,.2f} (de {(pr.get('listPrice') or 0)/100:,.2f})"
                        f" seller={o.get('seller')} atualizado={p.get('updatedAt')} | {p.get('name','')[:70]}")
                  print(f"       {p.get('url')}")

          print("== CUPONS E OFERTAS ativos")
          for bid, b in lojas.items():
              j = get("/affiliate/campaigns", organizationId=bid, status="onTime", limit=5)
              if j and j.get("data"):
                  print(f"  {b.get('name')}: {(j.get('meta') or {}).get('total')} campanhas")
                  for x in j["data"][:3]:
                      print(f"     {x.get('type')}: {str(x.get('name'))[:80]}")
          print("== DETALHE (formato bruto, encurtado)")
          import json
          def bruto(nome, path, **params):
              time.sleep(1.2)
              r = requests.get(API + path, headers=H, params=params, timeout=30)
              print(f"-- {nome}: {r.status_code}")
              print(r.text[:2500])
          tb = [bid for bid, b in lojas.items() if b.get("name") == "TeraByte"]
          bruto("produtos sem filtro", "/affiliate/products", limit=2)
          bruto("produtos busca rtx", "/affiliate/products", limit=2, search="rtx 5060")
          if tb:
              bruto("produtos terabyte", "/affiliate/products", limit=2, organizationIds=tb[0])
              bruto("campanhas terabyte", "/affiliate/campaigns", organizationId=tb[0], status="onTime", limit=3, types="Offer")
          print("== TODOS OS CUPONS ATIVOS (qualquer loja)")
          marcas = {}
          for pg_ in range(1, 15):
              j = get("/affiliate/campaigns", types="GenericCoupon", limit=20, page=pg_)
              if not j or not j.get("data"):
                  break
              for x in j["data"]:
                  oid = x.get("organizationId")
                  if oid not in marcas:
                      b = get(f"/affiliate/brands/{oid}") or {}
                      marcas[oid] = ((b.get("data") or b).get("name") if isinstance(b, dict) else None) or oid
                  fim = (x.get("period") or {}).get("endAt")
                  print(f"  {str(marcas[oid])[:25]:25} | {x.get('type')} | código={x.get('code') or x.get('coupon') or '-'} | até {fim} | {str(x.get('name'))[:70]}")
              if pg_ >= ((j.get("meta") or {}).get("totalPages") or 1):
                  break
          print("== ENCURTADOR (Custom) PARA A LENOVO")
          lv = [b for b in (get("/affiliate/brands", search="lenovo", limit=20) or {}).get("data", []) if b.get("name", "").lower() == "lenovo"]
          if lv:
              for url in ["https://www.lenovo.com/br/pt/p/laptops/ideapad/ideapad-s-series/lenovo-ideapad-slim-3i-gen-10-15-inch-intel/83ns000lbr",
                          "https://www.lenovo.com/br/pt/laptops/"]:
                  time.sleep(1.2)
                  r = requests.post(API + "/affiliate/shortener/url", headers={**H, "Content-Type": "application/json"}, timeout=30,
                                    json={"organizationId": lv[0]["id"], "type": "Custom", "url": url, "mdasc": "teste"})
                  print("  ", r.status_code, url[-40:], r.text[:400])
          print("== MARCAS PEDIDAS PELO DONO")
          for q in ["xiaomi", "mi store", "pcyes", "shopinfo", "concordia", "concórdia"]:
              for b in (get("/affiliate/brands", search=q, limit=20) or {}).get("data", []):
                  com = (b.get("commission") or {}).get("value")
                  print(f"  [{q}] {b.get('name')} | {b.get('site')} | comissão={com}% | id={b.get('id')}")
          EOF
